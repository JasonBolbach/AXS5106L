; RGBTouch example for the Waveshare ESP32-C6-Touch-LCD-1.47
; Open this folder in PlatformIO, or copy the env into your own project and
; replace the symlink dependency with:
;   jasonbolbach/AXS5106L@^1.0.0

[platformio]
src_dir = .

[env:waveshare-esp32-c6-touch-lcd-147]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    symlink://../..
    lovyan03/LovyanGFX@^1.2.36
